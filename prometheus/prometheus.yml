global:
  scrape_interval: 5s

scrape_configs:
  # Internal metrics listener (METRICS_PORT). The public app port answers
  # GET/HEAD /metrics with 404 and is not a scrape target.
  - job_name: 'meetropolis-server'
    metrics_path: /metrics
    static_configs:
      - targets: ['server:9100']

  - job_name: 'livekit'
    metrics_path: /metrics
    static_configs:
      - targets: ['livekit:9090']
