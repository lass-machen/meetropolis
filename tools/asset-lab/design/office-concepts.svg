      <path class="wall" d="M137 14 V101 M137 149 V258 M313 14 V101 M313 149 V258"/>
      <rect x="169" y="13" width="113" height="88" fill="#e5d7c5"/><text x="226" y="34" class="zone" text-anchor="middle">Besprechung</text><use href="#table" x="181" y="42"/>
      <rect x="176" y="152" width="98" height="98" fill="#c6d5b5"/><text x="225" y="189" class="zone" text-anchor="middle">Hof</text><use href="#plant" x="190" y="211"/><use href="#plant" x="239" y="211"/>
      <text x="225" y="279" text-anchor="middle" class="small">Café &amp; Ankommen</text>
      <rect x="12" y="305" width="169" height="96" fill="#d3dfe0"/><rect x="269" y="305" width="169" height="96" fill="#d3dfe0"/>
      <text x="26" y="326" class="zone">Team C · 8 über beide Seiten</text>
      <use href="#desk" x="26" y="344" data-desk="17"/><use href="#desk" x="64" y="344" data-desk="18"/><use href="#desk" x="102" y="344" data-desk="19"/><use href="#desk" x="140" y="344" data-desk="20"/>
      <use href="#desk" x="281" y="344" data-desk="21"/><use href="#desk" x="319" y="344" data-desk="22"/><use href="#desk" x="357" y="344" data-desk="23"/><use href="#desk" x="395" y="344" data-desk="24"/>
      <path class="route" d="M225 400 V290 H153 V141 H80"/><path class="route" d="M225 290 H297 V141 H368"/><path class="route" d="M153 141 H290"/>
      <text x="225" y="444" text-anchor="middle" class="small">Eingang</text>
    </g>
    <text y="578" class="sub">Ein gemeinsamer Hof verbindet eigene Bereiche.</text>
    <text y="604" class="sub">Rückzug und Besprechung abseits der Laufachse.</text>
  </g>
  <path d="M50 821 H1530" stroke="#c7ccc1"/>
  <text x="50" y="852" class="small">Grundrissstudien · schematisch, je eigener Maßstab · Platzzahlen als Entwurfsziele · Laufwege und Kollisionen folgen in der Umsetzung</text>
</svg>
