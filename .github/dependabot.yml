# Dependabot configuration.
#
# Goal: keep security fixes flowing while stopping the "one PR per package"
# noise that produced #13-#15. Routine minor/patch bumps are grouped into a
# small number of weekly PRs; security updates are still opened individually by
# GitHub regardless of the grouping below.
#
# Note: the `ignore` entries below only suppress Dependabot *update PRs*. They
# do NOT hide the corresponding Security-tab alerts — those are dismissed
# separately with a documented rationale.
version: 2
updates:
  # npm workspaces (root package-lock.json covers apps/* and packages/shared).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # One PR for routine dev-tooling minor/patch bumps (eslint, vite, tsx, ...).
      dev-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # One PR for production minor/patch bumps.
      prod-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # elliptic: no patched release exists (GHSA-848j-6mx2-7j84). Transitive via
      # colyseus -> @colyseus/auth -> grant -> jwk-to-pem; the vulnerable ECDSA
      # sign path is never called here. Remove this entry once a fix ships.
      - dependency-name: 'elliptic'
      # typescript: TS 7 removes `baseUrl` and needs a tsconfig/paths migration
      # for no functional benefit right now. Defer the major until 6.x nears end
      # of support; minor/patch on 6.x keep flowing. Remove to adopt TS 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # mysql2: GHSA-3f6p-5ww8-9rcr (fixed in 3.22.0) and GHSA-rgwj-5xj2-c3m3
      # (fixed in 3.23.1), but the only consumer is the `prisma` CLI, which
      # pins 3.15.3 exactly. The MySQL driver is never loaded here: the
      # datasource is `postgresql` and the app connects via @prisma/adapter-pg.
      # `prisma` is an optional peer of @prisma/client, so
      # `npm prune --omit=dev` keeps it (and mysql2) in the runtime image; the
      # code path stays unreachable. An override would overrule an upstream
      # exact pin without removing real exposure. Remove this entry once prisma
      # ships a patched mysql2.
      - dependency-name: 'mysql2'
      # deepmerge-ts: GHSA-ggr8-5vv4-36mx (stack exhaustion on self-referencing
      # object graphs) is fixed in 8.0.0, but the only consumer is
      # @prisma/config, which pins 7.1.5 exactly and uses it as the c12 merger
      # for local configuration only (prisma.config.ts and its defaults). Like
      # mysql2 it ships in the runtime image with the prisma CLI and is not
      # reachable with external input. Remove this entry once @prisma/config
      # moves to deepmerge-ts 8.
      - dependency-name: 'deepmerge-ts'

  # Asset Atelier has its own lockfile and is not part of the root npm workspace.
  - package-ecosystem: 'npm'
    directory: '/tools/asset-lab'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dev-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      prod-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
