# Dependabot configuration.
#
# Goal: keep security fixes flowing while stopping the "one PR per package"
# noise that produced #13-#15. Routine minor/patch bumps are grouped into a
# small number of weekly PRs; security updates are still opened individually by
# GitHub regardless of the grouping below.
#
# Note: the `ignore` entries below only suppress Dependabot *update PRs*. They
# do NOT hide the corresponding Security-tab alerts — those are dismissed
# separately with a documented rationale.
version: 2
updates:
  # npm workspaces (root package-lock.json covers apps/* and packages/shared).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # One PR for routine dev-tooling minor/patch bumps (eslint, vite, tsx, ...).
      dev-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # One PR for production minor/patch bumps.
      prod-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # elliptic: no patched release exists (GHSA-848j-6mx2-7j84). Transitive via
      # colyseus -> @colyseus/auth -> grant -> jwk-to-pem; the vulnerable ECDSA
      # sign path is never called here. Remove this entry once a fix ships.
      - dependency-name: 'elliptic'
      # brace-expansion 1.x: CVE-2026-14257 uses a line-spanning `<= 5.0.7` range
      # with no 1.x backport. Only resolvable via the eslint 10 major (drops
      # minimatch@3). Dev-only, not reachable. Remove once eslint 10 is adopted.
      - dependency-name: 'brace-expansion'
        versions:
          - '1.x'
      # typescript: TS 7 removes `baseUrl` and needs a tsconfig/paths migration
      # for no functional benefit right now. Defer the major until 6.x nears end
      # of support; minor/patch on 6.x keep flowing. Remove to adopt TS 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # mysql2: GHSA-3f6p-5ww8-9rcr is fixed in 3.22.0, but the only consumer is
      # the `prisma` CLI, which pins 3.15.3 exactly. The MySQL driver is never
      # loaded here (Postgres via @prisma/adapter-pg) and `prisma` is a
      # devDependency that `npm prune --omit=dev` strips from the runtime image.
      # An override would overrule an upstream exact pin without removing real
      # exposure. Remove this entry once prisma ships a patched mysql2.
      - dependency-name: 'mysql2'

  # Asset Atelier has its own lockfile and is not part of the root npm workspace.
  - package-ecosystem: 'npm'
    directory: '/tools/asset-lab'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dev-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      prod-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
